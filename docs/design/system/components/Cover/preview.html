<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--bg)}
.c{position:relative;width:960px;height:300px;overflow:hidden;background:var(--bg);font-family:var(--font-sans)}
svg{position:absolute;inset:0}
.brand{fill:var(--brand)}.ink{fill:var(--ink)}.night{fill:var(--night)}.butter{fill:var(--butter)}.soft{fill:var(--brand-soft)}.hole{fill:var(--on-accent)}
.n{position:absolute;left:48px;bottom:84px;margin:0;font-size:120px;line-height:.92;font-weight:780;letter-spacing:-.045em;color:var(--ink)}
.t{position:absolute;left:52px;bottom:48px;margin:0;font-size:14px;line-height:20px;color:var(--ink-muted);font-weight:500;max-width:440px}
</style></head><body><div class="c">
<svg width="960" height="300" viewBox="0 0 960 300">
<!-- blocks: brand mint 272x232 (radius-xl 28), night 176x200 (radius-xl), ink 128x72 (radius-lg), butter disc r28, brand-soft pill 256x48
     arrangement: one big mint slab bleeding off the top, the landing's night navy slab bleeding right, a soft pill along the bottom
     pattern: outlet holes — pairs of vertical slots (the mascot's eyes; 두리 = 둘 = two holes), from radius-full on 12x24 slots
     scales: pitch 80 / 72 (space-12 + space-8 / space-12 + space-6), slot gap 12 (space-3) -->
<rect class="brand" x="560" y="-40" width="272" height="232" rx="28"/>
<rect class="hole" x="584" y="40" width="12" height="24" rx="6"/><rect class="hole" x="608" y="40" width="12" height="24" rx="6"/><rect class="hole" x="584" y="112" width="12" height="24" rx="6"/><rect class="hole" x="608" y="112" width="12" height="24" rx="6"/><rect class="hole" x="664" y="40" width="12" height="24" rx="6"/><rect class="hole" x="688" y="40" width="12" height="24" rx="6"/><rect class="hole" x="664" y="112" width="12" height="24" rx="6"/><rect class="hole" x="688" y="112" width="12" height="24" rx="6"/><rect class="hole" x="744" y="40" width="12" height="24" rx="6"/><rect class="hole" x="768" y="40" width="12" height="24" rx="6"/><rect class="hole" x="744" y="112" width="12" height="24" rx="6"/><rect class="hole" x="768" y="112" width="12" height="24" rx="6"/>
<rect class="night" x="848" y="24" width="176" height="200" rx="28"/>
<rect class="hole" x="880" y="96" width="12" height="24" rx="6" style="fill:var(--brand)"/><rect class="hole" x="904" y="96" width="12" height="24" rx="6" style="fill:var(--brand)"/>
<rect class="ink" x="584" y="216" width="128" height="72" rx="20"/>
<rect class="soft" x="728" y="248" width="256" height="48" rx="24"/>
<circle class="butter" cx="900" cy="250" r="28"/>
</svg>
<p class="n">두리</p>
<p class="t">dool² · 부탁은 폰으로, 일은 내 컴퓨터가.</p>
</div></body></html>
