<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src http://127.0.0.1:*; img-src 'self' data:"
    />
    <title>두리</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <span class="face" aria-hidden="true"></span>
          <strong>두리</strong>
          <button id="open-settings" class="icon-btn" type="button" aria-label="설정" title="설정">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
              <circle cx="16" cy="7" r="2" />
              <circle cx="10" cy="17" r="2" />
            </svg>
          </button>
        </div>
        <div id="notice" class="notice" role="status" hidden></div>

        <button id="new-thread" class="nav-item" type="button">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20h8" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
          새 대화
        </button>

        <section class="block grow">
          <h2 class="over">대화</h2>
          <ul id="threads" class="threads"></ul>
        </section>

        <section class="block status">
          <h2 class="over">연결</h2>
          <div id="agents" class="status-list"><p class="cap stat">확인하는 중…</p></div>
          <div id="browser" class="status-list"></div>
        </section>
      </aside>

      <main class="main">
        <header class="head">
          <div>
            <h1 id="title">새 대화</h1>
            <p id="subtitle" class="cap"></p>
          </div>
          <div id="usage" class="usage" hidden></div>
        </header>

        <div id="messages" class="messages">
          <div class="empty" id="empty">
            <span class="face" aria-hidden="true"></span>
            <p class="hero">오늘은 뭘 대신 해 드릴까요?</p>
            <p class="sub">예약, 주문, 자잘한 일을 대신 해 드려요.<br />돈 쓰는 일은 꼭 먼저 물어볼게요.</p>
            <div class="examples">
              <button type="button" class="chip" data-example="지금 몇 시야?">지금 몇 시야?</button>
              <button type="button" class="chip" data-example="넌 누구야?">넌 누구야?</button>
              <button type="button" class="chip" data-example="뭘 할 수 있어?">뭘 할 수 있어?</button>
            </div>
          </div>
        </div>

        <form id="composer" class="composer">
          <div class="composer-box">
            <textarea id="input" rows="1" placeholder="두리에게 부탁하기…" aria-label="부탁 입력"></textarea>
            <div class="composer-bar">
              <div id="agent-pick" class="seg" role="radiogroup" aria-label="이 대화에 쓸 AI"></div>
              <button id="send" class="send" type="submit" aria-label="보내기" title="보내기 (Enter)">
                <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 19V5M6 11l6-6 6 6" />
                </svg>
              </button>
            </div>
          </div>
        </form>
      </main>
    </div>
    <section id="setup" class="setup" hidden aria-label="첫 설정"></section>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
