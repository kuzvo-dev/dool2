<!doctype html>
<html lang="ko" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src http://127.0.0.1:*; img-src 'self' data:"
    />
    <title>Dool2</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- Left: five tabs · side chats · Connections · Settings. Text comes from locales/app.ts (renderStatic) -->
      <nav class="side" data-t-aria="navLabel">
        <div class="brand">
          <span class="wordmark">dool<sup>2</sup><small data-t="brandSmall"></small></span>
        </div>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="update" class="notice update" role="status" hidden></div>
        <div id="tabs" class="side-tabs"></div>

        <section id="now" class="now" hidden>
          <h2 class="over" data-t="nowHead">Now</h2>
          <div id="now-list" class="now-list"></div>
        </section>

        <section id="threads" class="side-threads">
          <h2 id="threads-head" class="over threads-head" data-t="threadsHead">Side chats</h2>
          <div id="thread-list" class="thread-list"></div>
        </section>

        <div class="grow"></div>
        <div id="side-foot" class="side-foot"></div>
      </nav>

      <!-- Middle: the current tab -->
      <main class="main" id="main" data-view="talk">
        <header class="head">
          <div class="head-left">
            <div id="usage" class="usage" hidden></div>
          </div>
          <button id="agent" class="agent" type="button" data-t-aria="openPanel">
            <span id="head-av" class="agent-av"></span>
            <span id="head-tag" class="agent-tag" data-t="doori"></span>
          </button>
          <div class="head-right">
            <button id="device" class="fpill" type="button" data-t-title="deviceTitle">
              <i class="dot"></i><span id="device-text" data-t="deviceText"></span>
            </button>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="composer" class="composer-dock">
          <div id="attach" class="attach-preview" hidden></div>
          <div class="composer float">
            <button id="ideas-btn" class="cbtn plus" type="button" data-t-aria="ideasBtn" data-t-title="ideasBtn">
              <svg class="i md" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <textarea id="input" rows="1"></textarea>
            <button id="send" class="send-btn" type="submit">
              <svg class="i md" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
            </button>
          </div>
          <p class="composer-note meta" data-t="composerNote"></p>
        </form>
      </main>

      <!-- Right: assistant panel (opens and closes when the character is pressed) -->
      <aside id="panel" class="panel" data-t-aria="doori"></aside>
    </div>
    <div id="toast" class="toast app-toast" role="status" hidden></div>
    <section id="setup" class="setup" hidden data-t-aria="setupLabel"></section>
    <script type="module" src="renderer.js"></script>
      <div id="update-wall" class="update-wall" role="dialog" aria-modal="true" hidden></div>
  </body>
</html>
