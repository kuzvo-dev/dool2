<!doctype html>
<html lang="ko" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'"
    />
    <title>Dool2</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The 3-column shell (design source: docs/design/screens/src/PC.dc.html). renderer.ts fills each column:
         left nav + Now list, center chat/views + composer, right Dool2's-screen pane. Classes come from @dool2/ui.
         The aria-labels are set from the locale by renderer.ts. -->
    <div class="app" id="app">
      <nav class="side" id="side"></nav>
      <main class="main" id="main"></main>
      <aside class="panel" id="panel"></aside>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
