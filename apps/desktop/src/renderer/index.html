<!doctype html>
<html lang="ko" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src http://127.0.0.1:*; img-src 'self' data:"
    />
    <title>두리</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- 왼쪽: 탭 5개 · 따로 하는 대화 · 연결 · 설정 -->
      <nav class="side" aria-label="주요 메뉴">
        <div class="brand">
          <span class="wordmark">dool<sup>2</sup><small>두리</small></span>
        </div>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="tabs" class="side-tabs"></div>

        <section id="now" class="now" hidden>
          <h2 class="over">지금</h2>
          <div id="now-list" class="now-list"></div>
        </section>

        <section id="threads" class="side-threads">
          <h2 id="threads-head" class="over threads-head">따로 하는 대화</h2>
          <div id="thread-list" class="thread-list"></div>
        </section>

        <div class="grow"></div>
        <div id="side-foot" class="side-foot"></div>
      </nav>

      <!-- 가운데: 지금 탭 -->
      <main class="main" id="main" data-view="talk">
        <header class="head">
          <div class="head-left">
            <div id="usage" class="usage" hidden></div>
          </div>
          <button id="agent" class="agent" type="button" aria-label="두리 판 열기">
            <span id="head-av" class="agent-av"></span>
            <span id="head-tag" class="agent-tag">두리</span>
          </button>
          <div class="head-right">
            <button id="device" class="fpill" type="button" title="이 컴퓨터">
              <i class="dot"></i><span id="device-text">이 PC</span>
            </button>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="composer" class="composer-dock">
          <div class="composer float">
            <button id="ideas-btn" class="cbtn plus" type="button" aria-label="아이디어 보기" title="아이디어 보기">
              <svg class="i md" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <textarea id="input" rows="1" placeholder="두리에게 부탁하기" aria-label="두리에게 부탁하기"></textarea>
            <button id="send" class="send-btn" type="submit" aria-label="보내기" title="보내기 (Enter)">
              <svg class="i md" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
            </button>
          </div>
          <p class="composer-note meta">돈 드는 일과 누군가에게 보내는 일은 꼭 먼저 물어봐요</p>
        </form>
      </main>

      <!-- 오른쪽: 두리 판 (캐릭터를 누르면 열고 닫는다) -->
      <aside id="panel" class="panel" aria-label="두리"></aside>
    </div>
    <div id="toast" class="toast app-toast" role="status" hidden></div>
    <section id="setup" class="setup" hidden aria-label="첫 설정"></section>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
