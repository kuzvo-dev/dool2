name: Release

# Builds the Dool2 desktop app installers and uploads them to GitHub Releases (ADR 0028).
# Actions tab -> Release -> Run workflow. Enter the same version as `version` in apps/desktop/package.json.
# Before publishing, a maintainer creates the v<version> tag first: the repo's tag protection ruleset lets only
# admins create tags (11-23: publishing 0.3.0 failed because the build token could not create the tag).
#   git tag -a v0.3.0 <commit> && git push origin v0.3.0
# With publish off, it only builds the files (for checks: you also get screenshots of the app started on each OS).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (same as apps/desktop/package.json, e.g. 0.3.0)
        required: true
      notes:
        description: What changed (one line shown to users)
        required: true
      min:
        description: Versions below this must update (leave empty for none)
        required: false
      publish:
        description: Upload to GitHub Releases (off builds the files only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Both are built on Apple silicon: the dmg tool breaks on Intel machines (macos-15-intel)
        # (dmgbuild struct.error, 11-23). The Intel launch check runs under Rosetta
        arch: [arm64, x64]
    runs-on: macos-15
    env:
      DOOL2_ARCH: ${{ matrix.arch }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(node -p "require('./apps/desktop/package.json').version")" = "$VERSION"
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 8
      - run: pnpm build
        timeout-minutes: 12
      # Put our fixed certificate in a temporary keychain and trust it for code signing (runners have passwordless sudo).
      # Every version uses the same certificate, so macOS sees the same app: Accessibility and Screen Recording
      # permissions and the vault (keychain) carry over
      - name: Prepare signing certificate
        env:
          P12: ${{ secrets.DOOL2_MAC_CERT_P12 }}
          P12_PASS: ${{ secrets.DOOL2_MAC_CERT_PASS }}
        run: |
          kc="$RUNNER_TEMP/dool2.keychain-db"
          kp="$(openssl rand -hex 12)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/sign.p12" -clcerts -nokeys -passin env:P12_PASS -out "$RUNNER_TEMP/sign.crt" \
            || openssl pkcs12 -legacy -in "$RUNNER_TEMP/sign.p12" -clcerts -nokeys -passin env:P12_PASS -out "$RUNNER_TEMP/sign.crt"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.crt"
          security find-identity -v -p codesigning "$kc"
          echo "DOOL2_MAC_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/sign.p12"
      - name: Build installers
        env:
          DOOL2_MAC_SIGN_IDENTITY: Dool2 Release
        run: pnpm --filter @dool2/desktop package
        timeout-minutes: 15
      - name: Verify signature
        run: |
          app=$(ls -d apps/desktop/release/mac*/Dool2.app)
          codesign --verify --deep --strict "$app"
          codesign -dr - "$app" 2>&1 | tee "$RUNNER_TEMP/requirement.txt"
          grep -q 'certificate root' "$RUNNER_TEMP/requirement.txt"
      # Check: launch the built app and capture the first screen (does it start before a person tries it on a Mac)
      # The Intel build runs under Rosetta and is slow: wait longer, and do not fail the build if it does not start (11-23: over 3 minutes)
      - name: Launch check
        timeout-minutes: ${{ matrix.arch == 'x64' && 8 || 3 }}
        continue-on-error: ${{ matrix.arch == 'x64' }}
        run: |
          app=$(ls -d apps/desktop/release/mac*/Dool2.app)
          mkdir -p "$RUNNER_TEMP/smoke"
          DOOL2_SMOKE=1 DOOL2_SMOKE_UPDATE=available DOOL2_SMOKE_OUT="$RUNNER_TEMP/smoke" DOOL2_DATA_DIR="$RUNNER_TEMP/data" \
            "$app/Contents/MacOS/Dool2" | tee "$RUNNER_TEMP/smoke/log.txt"
          grep -q 'DOOL2_SMOKE' "$RUNNER_TEMP/smoke/log.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-${{ matrix.arch }}
          path: |
            apps/desktop/release/dool2-*.dmg
            apps/desktop/release/dool2-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-mac-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Check version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(node -p "require('./apps/desktop/package.json').version")" = "$VERSION"
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 8
      - run: pnpm build
        timeout-minutes: 12
      - name: Build installers
        run: pnpm --filter @dool2/desktop package
        timeout-minutes: 15
      - name: Launch check
        shell: bash
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          DOOL2_SMOKE=1 DOOL2_SMOKE_UPDATE=available DOOL2_SMOKE_OUT="$RUNNER_TEMP/smoke" DOOL2_DATA_DIR="$RUNNER_TEMP/data" \
            apps/desktop/release/win-unpacked/dool2.exe | tee "$RUNNER_TEMP/smoke/log.txt"
          grep -q 'DOOL2_SMOKE' "$RUNNER_TEMP/smoke/log.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-x64
          path: apps/desktop/release/dool2-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-win-x64
          path: ${{ runner.temp }}/smoke

  publish:
    name: Publish
    needs: [mac, windows]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{mac,win}-*"
          path: out
          merge-multiple: true
      - name: Sign version manifest
        env:
          DOOL2_UPDATE_KEY: ${{ secrets.DOOL2_UPDATE_KEY }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          MIN: ${{ inputs.min }}
        run: |
          node apps/desktop/scripts/release-manifest.mjs --dir out --version "$VERSION" --notes "$NOTES" \
            ${MIN:+--min "$MIN"}
          ls -la out
      - name: Check tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null \
            || { echo "::error::v$VERSION 태그가 없어요. 태그 보호 규칙 때문에 메인테이너가 먼저 만들어 올려야 해요"; exit 1; }
      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v$VERSION" out/* --verify-tag --title "두리 $VERSION" --notes "$NOTES"
