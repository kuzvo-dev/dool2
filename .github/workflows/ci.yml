name: CI

on:
  push:
    branches: [main]
  pull_request:
  # To run on macOS and Windows too: Actions tab -> CI -> Run workflow (turn on full)
  workflow_dispatch:
    inputs:
      full:
        description: Also check on macOS and Windows
        type: boolean
        default: true

# Read-only by default. PRs from outside contributors run only after a maintainer approves (repo setting)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux only while there is a single developer (2026-11-17; go back to all three once contributors join).
        # macOS and Windows run by hand (workflow_dispatch, full). When restoring, use the Intel runner for macOS:
        # GitHub macOS arm64 (macos-latest) was short on capacity and sometimes not picked up for hours (2026-11-16)
        os: ${{ fromJSON(inputs.full && '["macos-15-intel","windows-latest","ubuntu-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # CI never opens an Electron window, so skip the binary download
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 6
      - run: pnpm lint
        timeout-minutes: 4
      - run: pnpm build
        timeout-minutes: 8
      - run: pnpm typecheck
        timeout-minutes: 6
      # Tests sometimes hang on macOS runners, and a cancel after 15 minutes leaves no log: a step timeout fails it and keeps the log
      - run: pnpm test
        timeout-minutes: 8
      # Scenario bank format, and that each scenario has the tools and service cards it needs (no AI)
      - run: pnpm eval:static
        timeout-minutes: 2

  e2e:
    # Loads the extension into real Chrome (Chrome for Testing), connects it to a real daemon, and runs open, read,
    # click, dialogs, iframes, shadow DOM and mouse on test shops (apps/extension/scripts/e2e.mjs). Catches regressions
    # that depend on site structure
    name: Real browser test (extension)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Pinned to the tested Chrome build (so Chrome changes and code breakage are not mixed up)
      CHROME_BUILD: "157.0.8103.78"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 6
      - run: pnpm turbo run build --filter=@dool2/extension...
        timeout-minutes: 8
      - name: Download Chrome for Testing
        timeout-minutes: 4
        run: |
          out=$(npx -y @puppeteer/browsers@2 install "chrome@$CHROME_BUILD" --path "$RUNNER_TEMP/chrome" | tail -1)
          echo "DOOL2_TEST_CHROME=${out#* }" >> "$GITHUB_ENV"
      - name: Run tests
        timeout-minutes: 8
        run: xvfb-run -a node apps/extension/scripts/e2e.mjs
      # On the payment test shop (pay-shop.mjs), Dool2 tools go all the way: order form -> shipping iframe -> address
      # search iframe inside an iframe -> payment card -> late payment window -> keypad -> order complete with an order
      # number (measured 11-20 on Gmarket). Per-step table in out/e2e-pay-result.txt
      - name: Payment flow test
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: xvfb-run -a node apps/extension/scripts/e2e-pay.mjs
      - name: On failure, keep page reads and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-out
          path: apps/extension/out/
          retention-days: 7

  dco:
    name: DCO sign-off check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::커밋 $(git log -1 --format='%h %s' "$c") 에 Signed-off-by가 없어요. 'git commit -s'로 서명해 주세요 (CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing
