name: CI

on:
  push:
    branches: [main]
  pull_request:

# 기본은 읽기 전용. 외부 기여자 PR은 메인테이너 승인 뒤에만 돈다 (레포 설정)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 검사 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 맥은 Intel 러너로: GitHub의 맥 arm64(macos-latest) 자리가 모자라 몇 시간씩 잡히지 않고
        # 15분 뒤 단계 0개로 취소되는 일이 잦았다 (2026-11-16, PR 5개가 막힘). 검사(lint·build·typecheck·test)는 CPU 종류와 상관없다
        os: [macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # CI에서는 Electron 창을 띄우지 않으니 바이너리를 받지 않는다
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  dco:
    name: DCO 서명 확인
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 모든 커밋에 Signed-off-by가 있는지 확인
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::커밋 $(git log -1 --format='%h %s' "$c") 에 Signed-off-by가 없어요. 'git commit -s'로 서명해 주세요 (CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing
