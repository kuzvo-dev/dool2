name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 맥·윈도우까지 돌리고 싶을 때: Actions 탭 → CI → Run workflow (full 켜기)
  workflow_dispatch:
    inputs:
      full:
        description: 맥·윈도우도 검사
        type: boolean
        default: true

# 기본은 읽기 전용. 외부 기여자 PR은 메인테이너 승인 뒤에만 돈다 (레포 설정)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 검사 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 지금은 혼자 개발하는 동안이라 리눅스 하나만 (2026-11-17, 기여자가 생기면 셋 다로 되돌린다).
        # 맥·윈도우는 손으로 돌리기(workflow_dispatch, full)로. 되돌릴 때 맥은 Intel 러너:
        # GitHub 맥 arm64(macos-latest)는 자리가 모자라 몇 시간씩 못 잡히는 일이 있었다 (2026-11-16)
        os: ${{ fromJSON(inputs.full && '["macos-15-intel","windows-latest","ubuntu-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # CI에서는 Electron 창을 띄우지 않으니 바이너리를 받지 않는다
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 6
      - run: pnpm lint
        timeout-minutes: 4
      - run: pnpm build
        timeout-minutes: 8
      - run: pnpm typecheck
        timeout-minutes: 6
      # 맥 러너에서 가끔 테스트가 멈춰 15분 뒤 취소되면 로그가 남지 않는다: 단계 시간 제한으로 실패시켜 로그를 남긴다
      - run: pnpm test
        timeout-minutes: 8

  e2e:
    # 확장을 진짜 Chrome(Chrome for Testing)에 올리고 진짜 본체와 붙여 시험 가게에서 열기·읽기·누르기·알림창·
    # 액자·shadow DOM·마우스까지 돌린다 (apps/extension/scripts/e2e.mjs). 사이트 모양에 따른 회귀를 막는다
    name: 실제 브라우저 시험 (확장)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # 시험한 Chrome 판으로 고정 (Chrome이 바뀌어 깨지는 것과 코드가 깨지는 것을 섞지 않게)
      CHROME_BUILD: "157.0.8103.78"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 6
      - run: pnpm turbo run build --filter=@dool2/extension...
        timeout-minutes: 8
      - name: Chrome for Testing 받기
        timeout-minutes: 4
        run: |
          out=$(npx -y @puppeteer/browsers@2 install "chrome@$CHROME_BUILD" --path "$RUNNER_TEMP/chrome" | tail -1)
          echo "DOOL2_TEST_CHROME=${out#* }" >> "$GITHUB_ENV"
      - name: 시험 돌리기
        timeout-minutes: 8
        run: xvfb-run -a node apps/extension/scripts/e2e.mjs
      - name: 실패하면 읽은 화면·캡처 남기기
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-out
          path: apps/extension/out/
          retention-days: 7

  dco:
    name: DCO 서명 확인
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 모든 커밋에 Signed-off-by가 있는지 확인
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::커밋 $(git log -1 --format='%h %s' "$c") 에 Signed-off-by가 없어요. 'git commit -s'로 서명해 주세요 (CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing
