name: 기능 제안
description: 두리에 이런 기능이 있으면 좋겠어요
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 불편이 있나요?
      description: 기능보다 먼저, 어떤 상황에서 무엇이 불편한지 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 생각한 방법
      description: 두리가 어떻게 해 주면 좋을까요?
  - type: textarea
    id: alternatives
    attributes:
      label: 다른 방법도 생각해 봤나요?
  - type: checkboxes
    id: principles
    attributes:
      label: 확인
      options:
        - label: 결제·연락처럼 되돌리기 어려운 일을 허락 없이 하자는 제안이 아니에요.
          required: true
