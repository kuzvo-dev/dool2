name: Feature request
description: I'd like Dool2 to have this feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you having?
      description: Before the feature, tell us in what situation something is inconvenient and what.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like Dool2 to help?
  - type: textarea
    id: alternatives
    attributes:
      label: Have you considered other ways?
  - type: checkboxes
    id: principles
    attributes:
      label: Checklist
      options:
        - label: This doesn't propose doing hard-to-undo things, like paying or contacting someone, without approval.
          required: true
