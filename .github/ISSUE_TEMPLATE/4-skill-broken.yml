name: Broken skill
description: A skill no longer works because the site changed
labels: [skill, skill-broken]
body:
  - type: markdown
    attributes:
      value: |
        Skills break quickly when a site changes. The sooner you tell us, the sooner we fix it.
        **Please remove personal data such as IDs, booking numbers, and payment details** before posting.
  - type: input
    id: skill
    attributes:
      label: Skill name
      placeholder: "e.g. skills/srt-reserve"
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where did it get stuck?
      description: "Tell us which step changed and how. For example: the button name on the seat selection screen changed."
    validations:
      required: true
  - type: dropdown
    id: blocker
    attributes:
      label: Type of problem
      options:
        - Screen or button changed
        - Logged out
        - CAPTCHA or robot check appeared
        - New identity verification
        - Access blocked
        - Other
  - type: input
    id: date
    attributes:
      label: Date it happened
      placeholder: "e.g. 2026-11-14"
  - type: textarea
    id: screens
    attributes:
      label: Screenshots
      description: Please hide personal data.
