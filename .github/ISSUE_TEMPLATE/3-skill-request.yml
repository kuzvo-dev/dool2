name: Skill request
description: I'd like Dool2 to know how to use this service
labels: [skill, skill-request]
body:
  - type: markdown
    attributes:
      value: |
        A skill is a document that describes how Dool2 handles a specific service (for example, booking SRT trains or checking Hometax) from start to finish.
        You're welcome to write one yourself. You don't have to be a developer to contribute.
  - type: input
    id: service
    attributes:
      label: Service
      placeholder: "e.g. SRT, Coupang, Hometax, KakaoTalk PC"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What you want Dool2 to do
      placeholder: "e.g. Every Friday evening, tell me when a seat opens on the SRT from Suseo to Busan"
    validations:
      required: true
  - type: checkboxes
    id: tiers
    attributes:
      label: Tiers this task needs
      description: Select all that apply. Pay and contact always need the user's approval.
      options:
        - label: Lookup (read only)
        - label: Fill (fill in but don't submit; the user submits)
        - label: Pay (payments, confirming a booking)
        - label: Contact (sending messages or posts)
  - type: checkboxes
    id: write
    attributes:
      label: Participation
      options:
        - label: I can try this skill myself.
