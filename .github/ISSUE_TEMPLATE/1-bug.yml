name: Bug report
description: Dool2 behaved strangely or stopped working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please remove personal data such as accounts, phone numbers, addresses, and real conversations** before posting.
        If this is a security issue, use [private reporting](https://github.com/kuzvo-dev/dool2/security/advisories/new) instead of this form.
        Please write in English if you can. Korean is welcome too.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you were trying to do and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see the same problem again?
      placeholder: |
        1. Start Dool2
        2. Ask "..."
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI used
      options:
        - Claude Code
        - Codex
        - Doesn't matter / not sure
  - type: input
    id: version
    attributes:
      label: Dool2 version or commit
      placeholder: "e.g. v0.1.0, or a commit hash on main"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach them if you have any. Please hide personal data.
